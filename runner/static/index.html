<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Batch Runner</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div>
      <h1>Claude Batch Runner</h1>
      <p>Pair folders, attach prompt assets, run vision jobs, save JSON outputs.</p>
    </div>
    <div class="actions">
      <select id="recipeSelect"></select>
      <button class="btn-secondary" id="loadRecipeBtn">Load Recipe</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <h2>Recipe</h2>

      <label>Recipe name</label>
      <input id="recipeName" value="prompt_01_head_tagging" />

      <label>Static files (every run)</label>
      <div class="row">
        <input id="staticFileInput" placeholder="data/Prompt_01/..." />
        <button class="btn-secondary" id="addStaticBtn">Add</button>
      </div>
      <ul class="file-list" id="staticFiles"></ul>

      <label>Left folder (e.g. front view)</label>
      <div class="row">
        <input id="leftFolder" value="data/Render_FrontView" />
        <button class="btn-ghost" data-inspect="leftFolder">Inspect</button>
      </div>

      <label>Right folder (e.g. side view)</label>
      <div class="row">
        <input id="rightFolder" value="data/Render_SideView" />
        <button class="btn-ghost" data-inspect="rightFolder">Inspect</button>
      </div>

      <label>Pair suffix regex</label>
      <input id="suffixPattern" value="_grp_head_view_\d+$" />
      <p class="hint">Strips view angle suffix to match pairs across folders.</p>

      <label>Output directory</label>
      <input id="outputDir" value="output/prompt_01" />

      <label>Output naming</label>
      <input id="outputNaming" value="{pair_key}.json" />

      <label class="row" style="align-items:center; gap:0.4rem; margin-top:0.75rem;">
        <input type="checkbox" id="skipExisting" checked style="width:auto;" />
        Skip pairs with existing output
      </label>

      <div class="actions">
        <button class="btn-secondary" id="scanBtn">Scan Pairs</button>
        <button class="btn-secondary" id="dryRunBtn">Dry Run</button>
        <button class="btn-primary" id="runBtn">Run Batch</button>
      </div>

      <label>Run limit (optional)</label>
      <input id="runLimit" type="number" min="1" placeholder="All pairs" />
    </section>

    <section class="panel">
      <h2>Pair Scan</h2>
      <div class="stats">
        <div class="stat ok"><div class="value" id="statMatches">0</div><div class="label">Matches</div></div>
        <div class="stat warn"><div class="value" id="statLeftOnly">0</div><div class="label">Left only</div></div>
        <div class="stat warn"><div class="value" id="statRightOnly">0</div><div class="label">Right only</div></div>
        <div class="stat"><div class="value" id="statStatus">—</div><div class="label">Consistency</div></div>
      </div>

      <div class="progress"><div id="progressBar"></div></div>
      <div id="runSummary" class="hint"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Pair key</th>
              <th>Left</th>
              <th>Right</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="pairsBody"></tbody>
        </table>
      </div>

      <div class="log" id="log"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
