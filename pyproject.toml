[project]
name = "claude-api-starter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.49.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
